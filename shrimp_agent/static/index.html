<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>GGB小虾米 · 智能助手</title>
    <style>
        /* ===== 全局重置 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', Roboto, 'Helvetica Neue', sans-serif;
        }

        body {
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        .chat-box {
            width: 580px;
            max-width: 100%;
            height: 92vh;
            max-height: 800px;
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.06);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid rgba(0, 0, 0, 0.04);
            position: relative;
        }

        /* ===== 头部 ===== */
        .header {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(0, 0, 0, 0.04);
            flex-shrink: 0;
        }

        .header .left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .header .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4a6cf7, #6a4cf7);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 600;
            color: #fff;
            box-shadow: 0 2px 8px rgba(74, 108, 247, 0.2);
            flex-shrink: 0;
        }

        .header .info h1 {
            font-size: 18px;
            font-weight: 600;
            color: #1a2332;
            line-height: 1.2;
        }

        .header .info .sub {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 12px;
            color: #6b7a8f;
        }

        .header .info .sub .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #34c759;
            display: inline-block;
            transition: background 0.3s;
        }
        .header .info .sub .dot.offline {
            background: #ff6b6b;
        }

        .header .info .sub .skill-count {
            background: #f0f2f5;
            padding: 1px 10px;
            border-radius: 12px;
            font-size: 11px;
            color: #3d4a5c;
        }

        .header .actions {
            display: flex;
            gap: 4px;
        }

        .header .actions button {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 18px;
            color: #6b7a8f;
            padding: 4px 6px;
            border-radius: 10px;
            transition: background 0.15s, transform 0.1s;
            line-height: 1;
        }
        .header .actions button:hover {
            background: #f0f2f5;
        }
        .header .actions button:active {
            transform: scale(0.92);
        }

        /* ===== 消息区域 ===== */
        .messages {
            flex: 1;
            padding: 20px 24px 12px 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: #fafbfc;
        }

        .messages::-webkit-scrollbar {
            width: 4px;
        }
        .messages::-webkit-scrollbar-track {
            background: transparent;
        }
        .messages::-webkit-scrollbar-thumb {
            background: #d0d7de;
            border-radius: 8px;
        }

        /* ===== 消息气泡 ===== */
        .msg {
            max-width: 88%;
            padding: 10px 16px;
            border-radius: 16px;
            line-height: 1.7;
            font-size: 15px;
            word-wrap: break-word;
            animation: fadeUp 0.3s ease-out;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.02);
        }

        .msg.user {
            align-self: flex-end;
            background: #4a6cf7;
            color: #ffffff;
            border-bottom-right-radius: 4px;
            box-shadow: 0 2px 8px rgba(74, 108, 247, 0.2);
        }

        .msg.bot {
            align-self: flex-start;
            background: #ffffff;
            color: #1a2332;
            border: 1px solid #e8ecf0;
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
        }

        .msg.bot .label {
            font-size: 12px;
            color: #8a9aae;
            margin-bottom: 4px;
            font-weight: 500;
        }

        /* ===== Markdown 样式 ===== */
        .msg.bot code {
            background: #f0f2f5;
            padding: 1px 6px;
            border-radius: 4px;
            font-family: 'SF Mono', 'Fira Code', monospace;
            font-size: 0.9em;
            color: #d73a49;
        }
        .msg.bot pre {
            background: #f6f8fa;
            padding: 10px 14px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 6px 0;
            border: 1px solid #e8ecf0;
            font-family: 'SF Mono', 'Fira Code', monospace;
            font-size: 13px;
            line-height: 1.5;
        }
        .msg.bot pre code {
            background: transparent;
            padding: 0;
            color: #24292e;
        }
        .msg.bot strong {
            font-weight: 600;
        }
        .msg.bot ul, .msg.bot ol {
            padding-left: 20px;
            margin: 4px 0;
        }
        .msg.bot p {
            margin: 4px 0;
        }
        .msg.bot p:first-child {
            margin-top: 0;
        }
        .msg.bot p:last-child {
            margin-bottom: 0;
        }

        /* 思考消息特殊样式 */
        .msg.bot.think .label {
            color: #6a4cf7;
        }
        .msg.bot.think .label::before {
            content: "💭 ";
        }

        .msg img {
            max-width: 100%;
            max-height: 300px;
            border-radius: 10px;
            margin-top: 6px;
            border: 1px solid #e8ecf0;
            display: block;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(8px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* ===== 打字指示器 ===== */
        .typing-indicator {
            align-self: flex-start;
            background: #ffffff;
            border: 1px solid #e8ecf0;
            padding: 10px 18px;
            border-radius: 16px;
            border-bottom-left-radius: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #8a9aae;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.02);
            animation: fadeUp 0.2s ease-out;
        }

        .typing-indicator .dots span {
            display: inline-block;
            width: 7px;
            height: 7px;
            background: #b0bccd;
            border-radius: 50%;
            animation: wave 1.4s infinite both;
            margin: 0 1px;
        }
        .typing-indicator .dots span:nth-child(2) {
            animation-delay: 0.2s;
        }
        .typing-indicator .dots span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes wave {
            0%, 60%, 100% {
                transform: translateY(0);
                opacity: 0.4;
            }
            30% {
                transform: translateY(-6px);
                opacity: 1;
            }
        }

        /* ===== 快捷按钮 ===== */
        .quick-actions {
            padding: 8px 24px 12px 24px;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            background: #fafbfc;
            border-top: 1px solid #e8ecf0;
            flex-shrink: 0;
        }

        .quick-actions button {
            background: #f0f2f5;
            border: none;
            border-radius: 20px;
            padding: 5px 14px;
            font-size: 13px;
            color: #3d4a5c;
            cursor: pointer;
            transition: all 0.15s;
            font-family: inherit;
            white-space: nowrap;
        }
        .quick-actions button:hover {
            background: #e4e7ed;
            color: #1a2332;
            transform: translateY(-1px);
        }
        .quick-actions button:active {
            transform: scale(0.96);
        }

        /* ===== 输入区域 ===== */
        .input-area {
            display: flex;
            padding: 12px 20px 16px 20px;
            border-top: 1px solid #e8ecf0;
            background: #ffffff;
            gap: 10px;
            flex-shrink: 0;
        }

        .input-area input {
            flex: 1;
            padding: 10px 16px;
            border: 1px solid #d0d7de;
            border-radius: 24px;
            outline: none;
            font-size: 15px;
            background: #ffffff;
            color: #1a2332;
            transition: border 0.2s, box-shadow 0.2s;
        }

        .input-area input::placeholder {
            color: #9aabbf;
        }

        .input-area input:focus {
            border-color: #4a6cf7;
            box-shadow: 0 0 0 3px rgba(74, 108, 247, 0.08);
        }

        .input-area input:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .input-area button {
            padding: 10px 24px;
            background: #4a6cf7;
            color: #ffffff;
            border: none;
            border-radius: 24px;
            cursor: pointer;
            font-weight: 500;
            font-size: 14px;
            transition: background 0.2s, transform 0.1s;
            white-space: nowrap;
            box-shadow: 0 2px 8px rgba(74, 108, 247, 0.2);
        }

        .input-area button:hover {
            background: #3a5cd9;
        }
        .input-area button:active {
            transform: scale(0.96);
        }
        .input-area button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            box-shadow: none;
        }

        /* ===== 模态框 ===== */
        .modal-overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(4px);
            z-index: 100;
            border-radius: 24px;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.2s ease-out;
        }

        .modal-overlay.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal {
            background: #ffffff;
            width: 92%;
            max-width: 420px;
            max-height: 82%;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            animation: slideUp 0.25s ease-out;
        }

        @keyframes slideUp {
            from {
                transform: translateY(20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 12px;
            border-bottom: 1px solid #e8ecf0;
            flex-shrink: 0;
        }

        .modal-header h2 {
            font-size: 18px;
            font-weight: 600;
            color: #1a2332;
        }

        .modal-header .close-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #8a9aae;
            padding: 0 4px;
            transition: color 0.15s;
        }
        .modal-header .close-btn:hover {
            color: #1a2332;
        }

        .modal-body {
            flex: 1;
            overflow-y: auto;
            padding: 12px 0 4px 0;
        }

        .modal-body::-webkit-scrollbar {
            width: 4px;
        }
        .modal-body::-webkit-scrollbar-thumb {
            background: #d0d7de;
            border-radius: 8px;
        }

        .skill-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 4px;
            border-bottom: 1px solid #f0f2f5;
        }

        .skill-item .info {
            flex: 1;
            min-width: 0;
        }

        .skill-item .name {
            font-weight: 500;
            color: #1a2332;
        }

        .skill-item .desc {
            font-size: 13px;
            color: #6b7a8f;
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Toggle switch */
        .switch {
            position: relative;
            width: 38px;
            height: 20px;
            flex-shrink: 0;
            margin-left: 8px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #ccc;
            transition: 0.25s;
            border-radius: 34px;
        }

        .slider::before {
            content: "";
            position: absolute;
            height: 14px;
            width: 14px;
            left: 3px;
            bottom: 3px;
            background: white;
            transition: 0.25s;
            border-radius: 50%;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.15);
        }

        .switch input:checked + .slider {
            background: #4a6cf7;
        }

        .switch input:checked + .slider::before {
            transform: translateX(18px);
        }

        .switch input:disabled + .slider {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 480px) {
            .chat-box {
                height: 100vh;
                max-height: 100vh;
                border-radius: 16px;
            }
            .modal-overlay {
                border-radius: 16px;
            }
            .header {
                padding: 12px 16px;
            }
            .header .avatar {
                width: 34px;
                height: 34px;
                font-size: 16px;
            }
            .header .info h1 {
                font-size: 16px;
            }
            .header .info .sub {
                font-size: 11px;
            }
            .messages {
                padding: 14px 16px 8px 16px;
            }
            .msg {
                font-size: 14px;
                padding: 8px 12px;
                max-width: 94%;
            }
            .quick-actions {
                padding: 6px 16px 10px 16px;
            }
            .quick-actions button {
                font-size: 12px;
                padding: 4px 12px;
            }
            .input-area {
                padding: 10px 14px 14px 14px;
                gap: 8px;
            }
            .input-area input {
                font-size: 14px;
                padding: 8px 14px;
            }
            .input-area button {
                padding: 8px 18px;
                font-size: 13px;
            }
            .modal {
                width: 96%;
                max-height: 90%;
                padding: 16px 18px;
            }
        }
    </style>
</head>
<body>
    <div class="chat-box">
        <!-- 头部 -->
        <div class="header">
            <div class="left">
                <div class="avatar">虾</div>
                <div class="info">
                    <h1>GGB小虾米</h1>
                    <div class="sub">
                        <span class="dot" id="statusDot"></span>
                        <span id="statusText">在线</span>
                        <span class="skill-count" id="skillCount">加载中...</span>
                    </div>
                </div>
            </div>
            <div class="actions">
                <button id="clearBtn" title="清空对话">🗑️</button>
                <button id="manageSkillsBtn" title="管理技能">⚙️</button>
            </div>
        </div>

        <!-- 消息列表 -->
        <div class="messages" id="messages"></div>

        <!-- 快捷按钮 -->
        <div class="quick-actions" id="quickActions">
            <button data-msg="现在几点">🕐 时间</button>
            <button data-msg="截个图">📸 截图</button>
            <button data-msg="打开计算器">🔢 计算器</button>
            <button data-msg="3+5*2 等于多少">🧮 计算</button>
            <button data-msg="你好">👋 打招呼</button>
        </div>

        <!-- 输入区域 -->
        <div class="input-area">
            <input type="text" id="input" placeholder="输入你的问题…" autofocus />
            <button id="send">发送</button>
        </div>

        <!-- 技能管理模态框 -->
        <div class="modal-overlay" id="skillsModal">
            <div class="modal">
                <div class="modal-header">
                    <h2>🧩 技能管理</h2>
                    <button class="close-btn" id="closeModalBtn">✕</button>
                </div>
                <div class="modal-body" id="skillList">
                    <p style="color:#8a9aae; text-align:center; padding:20px;">加载中…</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        (function() {
            const messagesDiv = document.getElementById('messages');
            const input = document.getElementById('input');
            const sendBtn = document.getElementById('send');
            const statusText = document.getElementById('statusText');
            const statusDot = document.getElementById('statusDot');
            const skillCount = document.getElementById('skillCount');
            const manageBtn = document.getElementById('manageSkillsBtn');
            const clearBtn = document.getElementById('clearBtn');
            const modal = document.getElementById('skillsModal');
            const closeModalBtn = document.getElementById('closeModalBtn');
            const skillList = document.getElementById('skillList');

            let isWaiting = false;
            let skillsCache = [];

            // ===== 更新技能计数 =====
            async function updateSkillCount() {
                try {
                    const res = await fetch('/skills');
                    if (!res.ok) throw new Error();
                    const data = await res.json();
                    const skills = data.skills || {};
                    const count = Object.keys(skills).length;
                    skillCount.textContent = `${count} 个技能`;
                    skillsCache = skills;
                } catch {
                    skillCount.textContent = '—';
                }
            }

            // ===== 消息渲染 =====
            function renderMessage(text, isUser) {
                const div = document.createElement('div');
                div.className = `msg ${isUser ? 'user' : 'bot'}`;

                if (!isUser) {
                    const label = document.createElement('div');
                    label.className = 'label';
                    label.textContent = 'GGB小虾米';
                    div.appendChild(label);

                    // 检测思考消息
                    if (text.trim().startsWith('【思考过程】')) {
                        div.classList.add('think');
                    }
                }

                // 处理截图
                const imgMatch = text.match(/!\[screenshot\]\(data:image\/png;base64,([^)]+)\)/);
                if (imgMatch) {
                    const parts = text.split(/!\[screenshot\]\(data:image\/png;base64,[^)]+\)/);
                    for (let i = 0; i < parts.length; i++) {
                        if (parts[i].trim()) {
                            const p = document.createElement('p');
                            p.textContent = parts[i].trim();
                            div.appendChild(p);
                        }
                        if (i < parts.length - 1) {
                            const img = document.createElement('img');
                            img.src = `data:image/png;base64,${imgMatch[1]}`;
                            img.alt = '截图';
                            img.loading = 'lazy';
                            div.appendChild(img);
                        }
                    }
                    if (parts.length === 1 && !parts[0].trim()) {
                        const img = document.createElement('img');
                        img.src = `data:image/png;base64,${imgMatch[1]}`;
                        img.alt = '截图';
                        img.loading = 'lazy';
                        div.appendChild(img);
                    }
                } else {
                    // 简单 Markdown
                    let html = text;
                    html = html.replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>');
                    html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
                    html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
                    html = html.replace(/\n/g, '<br>');
                    const p = document.createElement('p');
                    p.innerHTML = html;
                    div.appendChild(p);
                }

                messagesDiv.appendChild(div);
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
            }

            function addMessage(text, isUser) {
                renderMessage(text, isUser);
            }

            function showTyping() {
                const existing = document.getElementById('typingIndicator');
                if (existing) return;

                const div = document.createElement('div');
                div.className = 'typing-indicator';
                div.id = 'typingIndicator';
                div.innerHTML = `
                    <span>思考中</span>
                    <span class="dots">
                        <span></span>
                        <span></span>
                        <span></span>
                    </span>
                `;
                messagesDiv.appendChild(div);
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
            }

            function hideTyping() {
                const el = document.getElementById('typingIndicator');
                if (el) el.remove();
            }

            // ===== 发送消息 =====
            async function sendMessage() {
                const text = input.value.trim();
                if (!text || isWaiting) return;

                isWaiting = true;
                input.disabled = true;
                sendBtn.disabled = true;
                statusText.textContent = '思考中…';
                statusDot.classList.remove('offline');

                addMessage(text, true);
                input.value = '';
                input.focus();

                showTyping();

                try {
                    const response = await fetch('/chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ message: text })
                    });

                    const data = await response.json();
                    hideTyping();

                    if (response.ok) {
                        addMessage(data.reply, false);
                    } else {
                        addMessage(`[错误] ${data.reply || '服务器异常'}`, false);
                    }
                } catch (error) {
                    hideTyping();
                    addMessage(`[错误] 连接失败: ${error.message}`, false);
                    statusDot.classList.add('offline');
                    statusText.textContent = '离线';
                } finally {
                    isWaiting = false;
                    input.disabled = false;
                    sendBtn.disabled = false;
                    statusText.textContent = '在线';
                    statusDot.classList.remove('offline');
                    input.focus();
                    updateSkillCount();
                }
            }

            // ===== 清空对话 =====
            function clearChat() {
                while (messagesDiv.firstChild) {
                    messagesDiv.removeChild(messagesDiv.firstChild);
                }
                setTimeout(() => {
                    addMessage('你好！我是 GGB小虾米，很高兴为你服务。', false);
                }, 200);
            }

            // ===== 技能管理 =====
            function renderSkills() {
                const names = Object.keys(skillsCache);
                if (names.length === 0) {
                    skillList.innerHTML = '<p style="color:#8a9aae;text-align:center;padding:20px;">暂无技能</p>';
                    return;
                }

                let html = '';
                names.forEach(name => {
                    const info = skillsCache[name];
                    html += `
                        <div class="skill-item">
                            <div class="info">
                                <div class="name">${name}</div>
                                <div class="desc">${info.description || '无描述'}</div>
                            </div>
                            <label class="switch">
                                <input type="checkbox" checked disabled data-name="${name}">
                                <span class="slider"></span>
                            </label>
                        </div>
                    `;
                });
                skillList.innerHTML = html;
            }

            function openModal() {
                modal.classList.add('active');
                updateSkillCount();
                setTimeout(renderSkills, 200);
            }

            function closeModal() {
                modal.classList.remove('active');
            }

            manageBtn.addEventListener('click', openModal);
            closeModalBtn.addEventListener('click', closeModal);
            modal.addEventListener('click', (e) => {
                if (e.target === modal) closeModal();
            });

            // ===== 事件绑定 =====
            clearBtn.addEventListener('click', () => {
                if (confirm('确定要清空所有对话吗？')) {
                    clearChat();
                }
            });

            sendBtn.addEventListener('click', sendMessage);
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    sendMessage();
                }
            });

            document.querySelectorAll('.quick-actions button').forEach(btn => {
                btn.addEventListener('click', () => {
                    input.value = btn.getAttribute('data-msg');
                    sendMessage();
                });
            });

            // ===== 初始化 =====
            updateSkillCount();
            setTimeout(() => {
                addMessage('你好！我是 GGB小虾米。\n我可以帮你计算、截图、回答问题，还能根据你的需求自动生成新功能。\n试试输入 "现在几点" 或 "3+5等于多少" 吧！', false);
            }, 300);

            input.focus();

            // 每30秒更新技能计数
            setInterval(updateSkillCount, 30000);
        })();
    </script>
</body>
</html>
