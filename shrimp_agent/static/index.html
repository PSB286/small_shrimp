<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <meta name="description" content="小虾米智能助手聊天界面">
    <meta name="theme-color" content="#1ec9d9">
    <title>小虾米 · 智能助手</title>
    <style>
        :root {
            --bg: #edfdfd;
            --bg-deep: #dff8fb;
            --panel: #ffffff;
            --panel-alt: #f5fcfd;
            --primary: #1ec9d9;
            --primary-dark: #14a9ba;
            --primary-soft: #dff9fc;
            --secondary: #ffb774;
            --secondary-soft: #fff1df;
            --border: #d8f3f7;
            --text: #143a45;
            --muted: #5d7d88;
            --muted-strong: #2d5966;
            --shadow: rgba(21, 118, 136, 0.12);
            --success: #4ac99b;
            --danger: #ff7d7d;
        }

        /* ===== 全局重置 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', Roboto, 'Helvetica Neue', sans-serif;
        }

        html {
            color-scheme: light;
        }

        body {
            background:
                radial-gradient(circle at top left, rgba(30, 201, 217, 0.18), transparent 28%),
                radial-gradient(circle at bottom right, rgba(255, 183, 116, 0.18), transparent 30%),
                linear-gradient(180deg, var(--bg) 0%, var(--bg-deep) 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
            color: var(--text);
        }

        .chat-box {
            width: 600px;
            max-width: 100%;
            height: 92vh;
            max-height: 820px;
            background: linear-gradient(180deg, rgba(255,255,255,0.98), rgba(245,252,253,0.96));
            border-radius: 28px;
            box-shadow: 0 18px 48px var(--shadow);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid rgba(20, 166, 186, 0.08);
            position: relative;
        }

        /* ===== 头部 ===== */
        .header {
            background: linear-gradient(180deg, rgba(255,255,255,0.96), rgba(233,252,255,0.92));
            backdrop-filter: blur(8px);
            padding: 14px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(30, 201, 217, 0.12);
            flex-shrink: 0;
        }

        .header .left {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .header .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #1ec9d9, #5ad8cf 45%, #ffb774 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 19px;
            font-weight: 700;
            color: #fff;
            box-shadow: 0 6px 16px rgba(30, 201, 217, 0.22);
            flex-shrink: 0;
            border: 2px solid rgba(255,255,255,0.8);
        }

        .header .info {
            min-width: 0;
        }
        .header .info h1 {
            font-size: 17px;
            font-weight: 700;
            color: var(--text);
            line-height: 1.2;
            letter-spacing: 0.02em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .header .info .sub {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 12px;
            color: var(--muted);
        }

        .header .info .sub .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--success);
            display: inline-block;
            transition: background 0.3s;
            box-shadow: 0 0 0 3px rgba(74, 201, 155, 0.18);
        }
        .header .info .sub .dot.offline {
            background: var(--danger);
            box-shadow: 0 0 0 3px rgba(255, 125, 125, 0.15);
        }

        .header .info .sub .skill-count {
            background: var(--primary-soft);
            padding: 2px 10px;
            border-radius: 999px;
            font-size: 11px;
            color: var(--muted-strong);
            border: 1px solid rgba(30, 201, 217, 0.12);
        }

        .header .actions {
            display: flex;
            gap: 4px;
        }

        .header .actions button {
            background: rgba(30, 201, 217, 0.08);
            border: none;
            cursor: pointer;
            font-size: 17px;
            color: var(--muted-strong);
            padding: 6px 8px;
            border-radius: 12px;
            transition: background 0.15s, transform 0.1s;
            line-height: 1;
        }
        .header .actions button:hover {
            background: rgba(30, 201, 217, 0.14);
        }
        .header .actions button:active {
            transform: scale(0.92);
        }

        /* ===== 消息区域 ===== */
        .messages {
            flex: 1;
            padding: 18px 20px 10px 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background:
                radial-gradient(circle at 10% 0%, rgba(30, 201, 217, 0.06), transparent 20%),
                radial-gradient(circle at 90% 100%, rgba(255, 183, 116, 0.09), transparent 24%),
                var(--panel-alt);
        }

        .messages::-webkit-scrollbar {
            width: 4px;
        }
        .messages::-webkit-scrollbar-track {
            background: transparent;
        }
        .messages::-webkit-scrollbar-thumb {
            background: #d0d7de;
            border-radius: 8px;
        }

        /* ===== 消息气泡 ===== */
        .msg {
            max-width: 88%;
            padding: 10px 14px;
            border-radius: 16px;
            line-height: 1.7;
            font-size: 15px;
            word-wrap: break-word;
            animation: fadeUp 0.3s ease-out;
            position: relative;
        }

        .msg.user {
            align-self: flex-end;
            background: linear-gradient(135deg, #1ec9d9, #3da9ff);
            color: #ffffff;
            border-bottom-right-radius: 4px;
            box-shadow: 0 8px 18px rgba(30, 201, 217, 0.22);
        }

        .msg.bot {
            align-self: flex-start;
            background: rgba(255,255,255,0.96);
            color: var(--text);
            border: 1px solid rgba(30, 201, 217, 0.16);
            border-bottom-left-radius: 4px;
            box-shadow: 0 6px 16px rgba(18, 52, 67, 0.04);
        }

        .msg.bot .label {
            font-size: 12px;
            color: #2f98ac;
            margin-bottom: 4px;
            font-weight: 600;
            letter-spacing: 0.04em;
        }

        /* 消息元信息：时间 + 操作按钮 */
        .msg .meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-top: 6px;
            opacity: 0;
            transition: opacity 0.18s;
        }
        .msg:hover .meta {
            opacity: 1;
        }

        .msg .meta .time {
            font-size: 11px;
            color: rgba(93, 125, 136, 0.75);
        }
        .msg.user .meta .time {
            color: rgba(255, 255, 255, 0.75);
        }

        .msg .meta .msg-actions {
            display: flex;
            gap: 4px;
        }
        .msg .meta .msg-actions button {
            background: rgba(30, 201, 217, 0.1);
            border: none;
            border-radius: 8px;
            padding: 3px 9px;
            font-size: 11px;
            color: var(--muted-strong);
            cursor: pointer;
            transition: background 0.15s, transform 0.1s;
            font-family: inherit;
        }
        .msg.user .meta .msg-actions button {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
        }
        .msg .meta .msg-actions button:hover {
            background: rgba(30, 201, 217, 0.2);
        }
        .msg.user .meta .msg-actions button:hover {
            background: rgba(255, 255, 255, 0.32);
        }
        .msg .meta .msg-actions button:active {
            transform: scale(0.94);
        }

        /* 引用块（气泡内） */
        .msg .quote {
            border-left: 3px solid var(--secondary);
            background: rgba(255, 183, 116, 0.1);
            border-radius: 8px;
            padding: 6px 10px;
            margin-bottom: 8px;
            font-size: 12.5px;
        }
        .msg.user .quote {
            border-left-color: rgba(255, 255, 255, 0.85);
            background: rgba(255, 255, 255, 0.16);
        }
        .msg .quote .quote-label {
            font-weight: 600;
            color: #c07b2e;
            margin-bottom: 2px;
        }
        .msg.user .quote .quote-label {
            color: rgba(255, 255, 255, 0.92);
        }
        .msg .quote .quote-body {
            color: var(--muted-strong);
            word-break: break-all;
            max-height: 60px;
            overflow: hidden;
        }
        .msg.user .quote .quote-body {
            color: rgba(255, 255, 255, 0.9);
        }

        /* ===== Markdown 样式 ===== */
        .msg.bot code {
            background: linear-gradient(180deg, #eefcff, #f5f8fa);
            padding: 1px 6px;
            border-radius: 4px;
            font-family: 'SF Mono', 'Fira Code', monospace;
            font-size: 0.9em;
            color: #0f7d87;
        }
        .msg.bot pre {
            background: linear-gradient(180deg, #f7feff, #eefafc);
            padding: 10px 14px;
            border-radius: 10px;
            overflow-x: auto;
            margin: 6px 0;
            border: 1px solid rgba(30, 201, 217, 0.16);
            font-family: 'SF Mono', 'Fira Code', monospace;
            font-size: 13px;
            line-height: 1.5;
        }
        .msg.bot pre code {
            background: transparent;
            padding: 0;
            color: #24292e;
        }
        .msg.bot strong {
            font-weight: 600;
        }
        .msg.bot ul, .msg.bot ol {
            padding-left: 20px;
            margin: 4px 0;
        }
        .msg.bot p {
            margin: 4px 0;
        }
        .msg.bot p:first-child {
            margin-top: 0;
        }
        .msg.bot p:last-child {
            margin-bottom: 0;
        }

        /* 思考消息特殊样式 */
        .msg.bot.think .label {
            color: #6a4cf7;
        }
        .msg.bot.think .label::before {
            content: "💭 ";
        }

        .msg img {
            max-width: 100%;
            max-height: 300px;
            border-radius: 10px;
            margin-top: 6px;
            border: 1px solid #e8ecf0;
            display: block;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(8px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* ===== 打字指示器 ===== */
        .typing-indicator {
            align-self: flex-start;
            background: #ffffff;
            border: 1px solid #e8ecf0;
            padding: 10px 18px;
            border-radius: 16px;
            border-bottom-left-radius: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #8a9aae;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.02);
            animation: fadeUp 0.2s ease-out;
        }

        .typing-indicator .dots span {
            display: inline-block;
            width: 7px;
            height: 7px;
            background: #b0bccd;
            border-radius: 50%;
            animation: wave 1.4s infinite both;
            margin: 0 1px;
        }
        .typing-indicator .dots span:nth-child(2) {
            animation-delay: 0.2s;
        }
        .typing-indicator .dots span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes wave {
            0%, 60%, 100% {
                transform: translateY(0);
                opacity: 0.4;
            }
            30% {
                transform: translateY(-6px);
                opacity: 1;
            }
        }

        /* ===== 快捷按钮 ===== */
        .quick-actions {
            padding: 8px 20px 10px 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            background: rgba(250, 254, 255, 0.8);
            border-top: 1px solid rgba(30, 201, 217, 0.1);
            flex-shrink: 0;
        }

        .quick-actions button {
            background: linear-gradient(180deg, #ecfeff, #f8fdff);
            border: 1px solid rgba(30, 201, 217, 0.14);
            border-radius: 999px;
            padding: 5px 13px;
            font-size: 13px;
            color: var(--muted-strong);
            cursor: pointer;
            transition: all 0.15s;
            font-family: inherit;
            white-space: nowrap;
            box-shadow: 0 4px 10px rgba(30, 201, 217, 0.04);
        }
        .quick-actions button:hover {
            background: linear-gradient(180deg, #dcfbff, #f1fcff);
            color: var(--text);
            transform: translateY(-1px);
        }
        .quick-actions button:active {
            transform: scale(0.96);
        }

        /* ===== 引用条（输入区上方） ===== */
        .quote-bar {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            margin: 8px 20px 0 20px;
            padding: 8px 12px;
            background: var(--secondary-soft);
            border: 1px solid rgba(255, 183, 116, 0.4);
            border-radius: 12px;
            flex-shrink: 0;
            animation: fadeUp 0.2s ease-out;
        }
        .quote-bar[hidden] {
            display: none;
        }
        .quote-bar .q-icon {
            font-size: 14px;
            line-height: 1.5;
        }
        .quote-bar .q-body {
            flex: 1;
            min-width: 0;
        }
        .quote-bar .q-label {
            font-size: 11px;
            font-weight: 600;
            color: #c07b2e;
        }
        .quote-bar .q-text {
            font-size: 12.5px;
            color: var(--muted-strong);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.5;
        }
        .quote-bar button {
            background: none;
            border: none;
            cursor: pointer;
            color: #b08a5e;
            font-size: 15px;
            line-height: 1.3;
            padding: 0 2px;
            flex-shrink: 0;
            transition: color 0.15s, transform 0.1s;
        }
        .quote-bar button:hover {
            color: #7a5a33;
            transform: scale(1.1);
        }

        /* ===== 输入区域 ===== */
        .input-area {
            display: flex;
            align-items: flex-end;
            padding: 10px 16px 14px 16px;
            border-top: 1px solid rgba(30, 201, 217, 0.1);
            background: linear-gradient(180deg, rgba(255,255,255,0.96), rgba(232,252,255,0.9));
            gap: 10px;
            flex-shrink: 0;
        }

        .input-wrap {
            flex: 1;
            min-width: 0;
            position: relative;
        }

        .input-area textarea {
            width: 100%;
            resize: none;
            padding: 10px 14px;
            border: 1px solid rgba(30, 201, 217, 0.22);
            border-radius: 20px;
            outline: none;
            font-size: 15px;
            background: rgba(255,255,255,0.9);
            color: var(--text);
            transition: border 0.2s, box-shadow 0.2s;
            line-height: 1.5;
            max-height: 140px;
            overflow-y: auto;
            font-family: inherit;
        }

        .input-area textarea::placeholder {
            color: #8bb0ba;
        }

        .input-area textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(30, 201, 217, 0.12);
        }

        .input-area textarea:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .input-area button {
            padding: 10px 22px;
            background: linear-gradient(135deg, var(--primary) 0%, #50bfeb 100%);
            color: #ffffff;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: transform 0.15s, box-shadow 0.15s;
            white-space: nowrap;
            box-shadow: 0 8px 18px rgba(30, 201, 217, 0.22);
            flex-shrink: 0;
        }

        .input-area button:hover {
            transform: translateY(-1px);
            box-shadow: 0 12px 20px rgba(30, 201, 217, 0.24);
        }
        .input-area button:active {
            transform: scale(0.96);
        }
        .input-area button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        /* ===== Toast ===== */
        .toast {
            position: fixed;
            left: 50%;
            bottom: 40px;
            transform: translateX(-50%) translateY(10px);
            background: rgba(20, 58, 69, 0.92);
            color: #fff;
            padding: 8px 18px;
            border-radius: 999px;
            font-size: 13px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s, transform 0.25s;
            z-index: 200;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ===== 模态框 ===== */
        .modal-overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(4px);
            z-index: 100;
            border-radius: 24px;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.2s ease-out;
        }

        .modal-overlay.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal {
            background: linear-gradient(180deg, #ffffff, #f4fdff);
            width: 92%;
            max-width: 440px;
            max-height: 82%;
            border-radius: 22px;
            box-shadow: 0 24px 60px rgba(18, 76, 85, 0.16);
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            animation: slideUp 0.25s ease-out;
            border: 1px solid rgba(30, 201, 217, 0.12);
        }

        @keyframes slideUp {
            from {
                transform: translateY(20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(30, 201, 217, 0.12);
            flex-shrink: 0;
        }

        .modal-header h2 {
            font-size: 18px;
            font-weight: 700;
            color: var(--text);
        }

        .modal-header .close-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #8a9aae;
            padding: 0 4px;
            transition: color 0.15s;
        }
        .modal-header .close-btn:hover {
            color: #1a2332;
        }

        .modal-body {
            flex: 1;
            overflow-y: auto;
            padding: 12px 0 4px 0;
        }

        .modal-body::-webkit-scrollbar {
            width: 4px;
        }
        .modal-body::-webkit-scrollbar-thumb {
            background: #d0d7de;
            border-radius: 8px;
        }

        .skill-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 4px;
            border-bottom: 1px solid rgba(30, 201, 217, 0.08);
        }

        .skill-item .info {
            flex: 1;
            min-width: 0;
        }

        .skill-item .name {
            font-weight: 600;
            color: var(--text);
        }

        .skill-item .desc {
            font-size: 13px;
            color: var(--muted);
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .skill-item.disabled {
            opacity: 0.55;
        }
        .skill-item .state-tag {
            font-size: 11px;
            color: var(--muted);
            margin-top: 2px;
        }

        /* Toggle switch */
        .switch {
            position: relative;
            width: 38px;
            height: 20px;
            flex-shrink: 0;
            margin-left: 8px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #ccc;
            transition: 0.25s;
            border-radius: 34px;
        }

        .slider::before {
            content: "";
            position: absolute;
            height: 14px;
            width: 14px;
            left: 3px;
            bottom: 3px;
            background: white;
            transition: 0.25s;
            border-radius: 50%;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.15);
        }

        .switch input:checked + .slider {
            background: linear-gradient(135deg, var(--primary), #67d7d9);
        }

        .switch input:checked + .slider::before {
            transform: translateX(18px);
        }

        .switch input:disabled + .slider {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* 环境信息 */
        .env-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 2px;
            border-bottom: 1px dashed rgba(30, 201, 217, 0.15);
            font-size: 13px;
        }
        .env-row .k {
            color: var(--muted);
        }
        .env-row .v {
            color: var(--muted-strong);
            font-weight: 500;
            max-width: 70%;
            text-align: right;
            word-break: break-all;
        }

        /* ===== 新增技能 ===== */
        .add-skill-hint {
            font-size: 12px;
            color: var(--muted);
            margin-bottom: 6px;
        }

        .template-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 12px;
        }
        .template-grid button {
            background: linear-gradient(180deg, #ecfeff, #f8fdff);
            border: 1px solid rgba(30, 201, 217, 0.18);
            border-radius: 999px;
            padding: 5px 12px;
            font-size: 12.5px;
            color: var(--muted-strong);
            cursor: pointer;
            transition: all 0.15s;
            font-family: inherit;
        }
        .template-grid button:hover:not(:disabled) {
            background: var(--primary-soft);
            transform: translateY(-1px);
        }
        .template-grid button.disabled {
            opacity: 0.45;
            cursor: not-allowed;
            text-decoration: line-through;
        }

        .add-input {
            width: 100%;
            padding: 9px 12px;
            border: 1px solid rgba(30, 201, 217, 0.22);
            border-radius: 12px;
            outline: none;
            font-size: 13.5px;
            color: var(--text);
            background: rgba(255,255,255,0.9);
            margin-bottom: 8px;
            font-family: inherit;
            box-sizing: border-box;
        }
        .add-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(30, 201, 217, 0.12);
        }

        .preview-box {
            display: none;
            background: linear-gradient(180deg, #f7feff, #eefafc);
            border: 1px solid rgba(30, 201, 217, 0.16);
            border-radius: 12px;
            padding: 10px 12px;
            margin-bottom: 10px;
            max-height: 240px;
            overflow: auto;
        }
        .preview-box .p-name {
            font-weight: 700;
            color: var(--text);
            font-size: 14px;
        }
        .preview-box .p-desc {
            font-size: 12.5px;
            color: var(--muted);
            margin: 2px 0 6px 0;
        }
        .preview-box pre {
            font-family: 'SF Mono', 'Fira Code', monospace;
            font-size: 12px;
            line-height: 1.5;
            color: #24292e;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .preview-box .p-check {
            color: var(--success);
            font-size: 12px;
            font-weight: 600;
        }

        .add-actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }
        .add-actions button {
            padding: 8px 16px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            font-family: inherit;
            transition: transform 0.15s, box-shadow 0.15s;
        }
        .add-actions button:active {
            transform: scale(0.96);
        }
        .add-actions .btn-confirm {
            background: linear-gradient(135deg, var(--success), #5fd8a8);
            color: #fff;
        }
        .add-actions .btn-confirm:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .add-actions .btn-regen {
            background: var(--primary-soft);
            color: var(--muted-strong);
        }
        .add-actions .btn-cancel {
            background: #f0f3f5;
            color: var(--muted);
        }

        /* ===== 响应式 ===== */
        @media (max-width: 480px) {
            .chat-box {
                height: 100vh;
                max-height: 100vh;
                border-radius: 16px;
            }
            .modal-overlay {
                border-radius: 16px;
            }
            .header {
                padding: 12px 16px;
            }
            .header .avatar {
                width: 34px;
                height: 34px;
                font-size: 16px;
            }
            .header .info h1 {
                font-size: 16px;
            }
            .header .info .sub {
                font-size: 11px;
            }
            .messages {
                padding: 14px 14px 8px 14px;
            }
            .msg {
                font-size: 14px;
                padding: 8px 12px;
                max-width: 94%;
            }
            .quick-actions {
                padding: 6px 14px 8px 14px;
            }
            .quick-actions button {
                font-size: 12px;
                padding: 4px 11px;
            }
            .quote-bar {
                margin: 6px 14px 0 14px;
            }
            .input-area {
                padding: 8px 12px 12px 12px;
                gap: 8px;
            }
            .input-area textarea {
                font-size: 14px;
                padding: 8px 12px;
            }
            .input-area button {
                padding: 8px 16px;
                font-size: 13px;
            }
            .modal {
                width: 96%;
                max-height: 90%;
                padding: 16px 18px;
            }
        }
    </style>
</head>
<body>
    <div class="chat-box">
        <!-- 头部 -->
        <div class="header">
            <div class="left">
                <div class="avatar" aria-label="小虾米头像">🦐</div>
                <div class="info">
                    <h1 id="agentName">小虾米</h1>
                    <div class="sub" aria-live="polite">
                        <span class="dot" id="statusDot"></span>
                        <span id="statusText">在线</span>
                        <span class="skill-count" id="skillCount">加载中...</span>
                    </div>
                </div>
            </div>
            <div class="actions">
                <button id="envBtn" title="环境能力" aria-label="环境能力">🖥️</button>
                <button id="addSkillBtn" title="新增技能" aria-label="新增技能">➕</button>
                <button id="manageSkillsBtn" title="管理技能" aria-label="管理技能">⚙️</button>
                <button id="clearBtn" title="清空对话" aria-label="清空对话">🗑️</button>
            </div>
        </div>

        <!-- 消息列表 -->
        <div class="messages" id="messages"></div>

        <!-- 快捷按钮 -->
        <div class="quick-actions" id="quickActions">
            <button data-msg="现在几点">🕐 时间</button>
            <button data-msg="3+5*2 等于多少">🧮 计算</button>
            <button data-msg="你好">👋 打招呼</button>
            <button data-msg="查看记忆">📚 记忆</button>
            <button data-msg="列出技能">📜 技能</button>
            <button data-msg="新增技能：打开记事本">✨ 学新技能</button>
        </div>

        <!-- 引用条 -->
        <div class="quote-bar" id="quoteBar" hidden>
            <span class="q-icon">💬</span>
            <div class="q-body">
                <div class="q-label" id="quoteLabel">引用</div>
                <div class="q-text" id="quoteText"></div>
            </div>
            <button id="quoteClose" title="取消引用">✕</button>
        </div>

        <!-- 输入区域 -->
        <div class="input-area">
            <div class="input-wrap">
                <textarea id="input" rows="1" placeholder="输入问题…（↑ 键查看发送记录，Shift+Enter 换行）" autofocus></textarea>
            </div>
            <button id="send">发送</button>
        </div>

        <!-- 技能管理模态框 -->
        <div class="modal-overlay" id="skillsModal">
            <div class="modal" role="dialog" aria-modal="true" aria-labelledby="skillModalTitle">
                <div class="modal-header">
                    <h2 id="skillModalTitle">🧩 技能管理</h2>
                    <button class="close-btn" id="closeModalBtn">✕</button>
                </div>
                <div class="modal-body" id="skillList">
                    <p style="color:#8a9aae; text-align:center; padding:20px;">加载中…</p>
                </div>
            </div>
        </div>

        <!-- 环境能力模态框 -->
        <div class="modal-overlay" id="envModal">
            <div class="modal" role="dialog" aria-modal="true" aria-labelledby="envModalTitle">
                <div class="modal-header">
                    <h2 id="envModalTitle">🖥️ 环境能力</h2>
                    <button class="close-btn" id="closeEnvModalBtn">✕</button>
                </div>
                <div class="modal-body" id="envBody">
                    <p style="color:#8a9aae; text-align:center; padding:20px;">加载中…</p>
                </div>
            </div>
        </div>

        <!-- 新增技能模态框（模板 + 预览 + 确认） -->
        <div class="modal-overlay" id="addSkillModal">
            <div class="modal" role="dialog" aria-modal="true" aria-labelledby="addSkillTitle">
                <div class="modal-header">
                    <h2 id="addSkillTitle">➕ 新增技能</h2>
                    <button class="close-btn" id="closeAddSkillBtn">✕</button>
                </div>
                <div class="modal-body">
                    <div class="add-skill-hint">📖 <b>学习模式</b>：填三要素自动生成；或选模板 / 直接描述需求</div>
                    <div style="display:flex;gap:6px;margin-bottom:8px;">
                        <input class="add-input" id="learnMaterial" placeholder="材料（如：电脑记事本）" style="flex:1;margin-bottom:0;" />
                    </div>
                    <div style="display:flex;gap:6px;margin-bottom:8px;">
                        <input class="add-input" id="learnContent" placeholder="学习内容（如：使用记事本）" style="flex:1;margin-bottom:0;" />
                        <input class="add-input" id="learnLevel" placeholder="程度（了解/基本使用/熟练/完全掌握）" style="flex:1;margin-bottom:0;" />
                    </div>
                    <div class="add-skill-hint" style="margin-top:-4px;">或选模板 / 自由描述：</div>
                    <div class="template-grid" id="templateGrid"></div>
                    <input class="add-input" id="addSkillInput" placeholder="描述你的技能需求，如：获取电脑磁盘剩余空间" />
                    <div class="preview-box" id="previewBox">
                        <div class="p-name" id="previewName"></div>
                        <div class="p-desc" id="previewDesc"></div>
                        <div class="p-check">✅ 已通过自动校验与冒烟测试</div>
                        <pre id="previewCode"></pre>
                    </div>
                    <div class="add-actions">
                        <button class="btn-cancel" id="addCancelBtn">取消</button>
                        <button class="btn-regen" id="addRegenBtn" style="display:none;">🔄 重新生成</button>
                        <button class="btn-confirm" id="addConfirmBtn" disabled>✓ 确认添加</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        (function() {
            'use strict';

            // ===== DOM 引用 =====
            const messagesDiv = document.getElementById('messages');
            const input = document.getElementById('input');
            const sendBtn = document.getElementById('send');
            const statusText = document.getElementById('statusText');
            const statusDot = document.getElementById('statusDot');
            const skillCount = document.getElementById('skillCount');
            const agentName = document.getElementById('agentName');
            const manageBtn = document.getElementById('manageSkillsBtn');
            const clearBtn = document.getElementById('clearBtn');
            const envBtn = document.getElementById('envBtn');
            const modal = document.getElementById('skillsModal');
            const closeModalBtn = document.getElementById('closeModalBtn');
            const skillList = document.getElementById('skillList');
            const envModal = document.getElementById('envModal');
            const closeEnvModalBtn = document.getElementById('closeEnvModalBtn');
            const envBody = document.getElementById('envBody');
            const quoteBar = document.getElementById('quoteBar');
            const quoteLabel = document.getElementById('quoteLabel');
            const quoteText = document.getElementById('quoteText');
            const quoteClose = document.getElementById('quoteClose');
            const toast = document.getElementById('toast');

            let isWaiting = false;
            let skillsCache = {};
            let quoteState = null;          // { role: 'user'|'bot', content: string }

            // ===== 发送历史（↑↓ 键浏览，localStorage 持久化） =====
            const HISTORY_KEY = 'shrimp_sent_history';
            let sentHistory = [];
            let historyIndex = -1;          // -1 = 未在浏览历史
            let historyDraft = '';          // 进入历史前保存的草稿

            try {
                const saved = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
                if (Array.isArray(saved)) sentHistory = saved.filter(s => typeof s === 'string');
            } catch (e) { /* ignore */ }

            function saveHistory() {
                try {
                    localStorage.setItem(HISTORY_KEY, JSON.stringify(sentHistory.slice(-100)));
                } catch (e) { /* ignore */ }
            }

            function pushHistory(text) {
                const last = sentHistory[sentHistory.length - 1];
                if (last !== text) sentHistory.push(text);
                if (sentHistory.length > 100) sentHistory.shift();
                saveHistory();
                historyIndex = -1;
                historyDraft = '';
            }

            // ===== 工具函数 =====
            function setStatus(online, text) {
                statusText.textContent = text;
                statusDot.classList.toggle('offline', !online);
            }

            function escapeHtml(value) {
                return String(value)
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#39;');
            }

            function nowTime() {
                return new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
            }

            let toastTimer = null;
            function showToast(msg) {
                toast.textContent = msg;
                toast.classList.add('show');
                clearTimeout(toastTimer);
                toastTimer = setTimeout(() => toast.classList.remove('show'), 1600);
            }

            async function copyText(text) {
                try {
                    await navigator.clipboard.writeText(text);
                    showToast('已复制 📋');
                } catch (e) {
                    const ta = document.createElement('textarea');
                    ta.value = text;
                    document.body.appendChild(ta);
                    ta.select();
                    try {
                        document.execCommand('copy');
                        showToast('已复制 📋');
                    } catch (err) {
                        showToast('复制失败');
                    }
                    document.body.removeChild(ta);
                }
            }

            // ===== Markdown 渲染（修复代码块二次转义） =====
            function formatBotMarkdown(text) {
                const blocks = [];
                let html = String(text).replace(/```([\s\S]*?)```/g, (_, code) => {
                    blocks.push(code);
                    return '\u0000CODE' + (blocks.length - 1) + '\u0000';
                });
                html = escapeHtml(html);
                html = html.replace(/\u0000CODE(\d+)\u0000/g, (_, i) => `<pre><code>${escapeHtml(blocks[+i])}</code></pre>`);
                html = html.replace(/`([^`]+)`/g, (_, c) => `<code>${escapeHtml(c)}</code>`);
                html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
                html = html.replace(/\[(.+?)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
                return html.replace(/\n/g, '<br>');
            }

            function formatQuoteText(text) {
                const t = String(text).replace(/\s+/g, ' ').trim();
                return t.length > 160 ? t.slice(0, 160) + '…' : t;
            }

            // ===== 更新技能计数 =====
            async function updateSkillCount() {
                try {
                    const res = await fetch('/skills');
                    if (!res.ok) throw new Error('技能接口异常');
                    const data = await res.json();
                    const skills = data.skills || {};
                    // 头部只显示"已启用"的技能数；skillsCache 保留全部（含禁用）供弹窗使用
                    const count = Object.values(skills).filter(s => s && s.enabled !== false).length;
                    skillCount.textContent = `${count} 个技能`;
                    skillsCache = skills;
                    setStatus(true, '在线');
                } catch {
                    skillCount.textContent = '—';
                    setStatus(false, '离线');
                }
            }

            // ===== 引用 =====
            function setQuote(role, content) {
                quoteState = { role: role, content: String(content) };
                quoteLabel.textContent = role === 'user' ? '引用你的消息' : '引用小虾米的回答';
                quoteText.textContent = formatQuoteText(content);
                quoteBar.hidden = false;
                input.focus();
            }

            function clearQuote() {
                quoteState = null;
                quoteBar.hidden = true;
            }

            quoteClose.addEventListener('click', clearQuote);

            // ===== 消息渲染 =====
            function renderMessage(text, isUser, quote) {
                const div = document.createElement('div');
                div.className = `msg ${isUser ? 'user' : 'bot'}`;

                if (!isUser) {
                    const label = document.createElement('div');
                    label.className = 'label';
                    label.textContent = '小虾米';
                    div.appendChild(label);

                    if (String(text).trim().startsWith('【思考过程】')) {
                        div.classList.add('think');
                    }
                }

                // 引用块
                if (quote && quote.content) {
                    const q = document.createElement('div');
                    q.className = 'quote';
                    const qLabel = document.createElement('div');
                    qLabel.className = 'quote-label';
                    qLabel.textContent = quote.role === 'user' ? '引用你的消息' : '引用小虾米的回答';
                    const qBody = document.createElement('div');
                    qBody.className = 'quote-body';
                    qBody.innerHTML = escapeHtml(formatQuoteText(quote.content)).replace(/\n/g, '<br>');
                    q.appendChild(qLabel);
                    q.appendChild(qBody);
                    div.appendChild(q);
                }

                // 正文（兼容截图 data URL）
                const screenshotRegex = /!\[screenshot\]\(data:image\/png;base64,([^)]+)\)/g;
                const matches = Array.from(String(text).matchAll(screenshotRegex));

                if (matches.length > 0) {
                    const parts = String(text).split(screenshotRegex);
                    for (let i = 0; i < parts.length; i++) {
                        if (parts[i].trim()) {
                            const p = document.createElement('p');
                            p.textContent = parts[i].trim();
                            div.appendChild(p);
                        }
                        if (i < parts.length - 1) {
                            const img = document.createElement('img');
                            img.src = `data:image/png;base64,${matches[i][1]}`;
                            img.alt = '截图';
                            img.loading = 'lazy';
                            div.appendChild(img);
                        }
                    }
                } else {
                    const p = document.createElement('p');
                    p.innerHTML = formatBotMarkdown(text);
                    div.appendChild(p);
                }

                // 元信息：时间 + 操作（复制 / 引用）
                const meta = document.createElement('div');
                meta.className = 'meta';
                const time = document.createElement('span');
                time.className = 'time';
                time.textContent = nowTime();

                const actions = document.createElement('span');
                actions.className = 'msg-actions';
                const copyBtn = document.createElement('button');
                copyBtn.textContent = '复制';
                copyBtn.title = '复制消息';
                copyBtn.addEventListener('click', (e) => { e.stopPropagation(); copyText(text); });
                const quoteBtn = document.createElement('button');
                quoteBtn.textContent = '引用';
                quoteBtn.title = '引用这条消息';
                quoteBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    setQuote(isUser ? 'user' : 'bot', text);
                });
                actions.appendChild(copyBtn);
                actions.appendChild(quoteBtn);

                meta.appendChild(time);
                meta.appendChild(actions);
                div.appendChild(meta);

                messagesDiv.appendChild(div);
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
            }

            function addMessage(text, isUser, quote) {
                renderMessage(text, isUser, quote);
            }

            function showTyping() {
                const existing = document.getElementById('typingIndicator');
                if (existing) return;

                const div = document.createElement('div');
                div.className = 'typing-indicator';
                div.id = 'typingIndicator';
                div.innerHTML = `
                    <span>思考中</span>
                    <span class="dots">
                        <span></span>
                        <span></span>
                        <span></span>
                    </span>
                `;
                messagesDiv.appendChild(div);
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
            }

            function hideTyping() {
                const el = document.getElementById('typingIndicator');
                if (el) el.remove();
            }

            // ===== 输入框自适应高度 =====
            function autoResize() {
                input.style.height = 'auto';
                input.style.height = Math.min(input.scrollHeight, 140) + 'px';
            }
            input.addEventListener('input', () => {
                autoResize();
                // 手动输入时退出历史浏览
                if (historyIndex !== -1) historyIndex = -1;
            });

            // ===== 发送消息 =====
            async function sendMessage() {
                const text = input.value.trim();
                if (!text || isWaiting) return;

                isWaiting = true;
                input.disabled = true;
                sendBtn.disabled = true;
                statusText.textContent = '思考中…';
                statusDot.classList.remove('offline');

                const quote = quoteState ? { role: quoteState.role, content: quoteState.content } : null;

                addMessage(text, true, quote);
                pushHistory(text);

                input.value = '';
                autoResize();
                clearQuote();
                input.focus();

                showTyping();

                try {
                    const response = await fetch('/chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ message: text, quote: quote })
                    });

                    const data = await response.json();
                    hideTyping();

                    if (response.ok) {
                        addMessage(data.reply, false);
                    } else {
                        addMessage(`[错误] ${data.reply || '服务器异常'}`, false);
                    }
                } catch (error) {
                    hideTyping();
                    addMessage(`[错误] 连接失败: ${error.message}`, false);
                    statusDot.classList.add('offline');
                    statusText.textContent = '离线';
                } finally {
                    isWaiting = false;
                    input.disabled = false;
                    sendBtn.disabled = false;
                    statusText.textContent = '在线';
                    statusDot.classList.remove('offline');
                    input.focus();
                    updateSkillCount();
                }
            }

            // ===== 清空对话 =====
            function clearChat() {
                while (messagesDiv.firstChild) {
                    messagesDiv.removeChild(messagesDiv.firstChild);
                }
                clearQuote();
                setTimeout(() => {
                    addMessage('你好！我是小虾米，很高兴为你服务。', false);
                }, 200);
            }

            // ===== 技能管理 =====
            function renderSkills() {
                const names = Object.keys(skillsCache);
                if (names.length === 0) {
                    skillList.innerHTML = '<p style="color:#8a9aae;text-align:center;padding:20px;">暂无技能<br><span style="font-size:12px;">对小虾米说「新增技能：XXX」即可学习</span></p>';
                    return;
                }

                let html = '';
                names.forEach(name => {
                    const info = skillsCache[name] || {};
                    const safeName = escapeHtml(name);
                    const safeDesc = escapeHtml(info.description || '无描述');
                    const enabled = info.enabled !== false;
                    const disabledCls = enabled ? '' : ' disabled';
                    const stateTag = enabled ? '' : '<div class="state-tag">⏸ 已禁用</div>';
                    html += `
                        <div class="skill-item${disabledCls}">
                            <div class="info">
                                <div class="name">${safeName}</div>
                                <div class="desc">${safeDesc}</div>
                                ${stateTag}
                            </div>
                            <label class="switch">
                                <input type="checkbox" ${enabled ? 'checked' : ''} data-name="${safeName}">
                                <span class="slider"></span>
                            </label>
                        </div>
                    `;
                });
                skillList.innerHTML = html;
            }

            skillList.addEventListener('change', async (e) => {
                const checkbox = e.target.closest('.switch input');
                if (!checkbox) return;
                const name = checkbox.dataset.name;
                const enabled = checkbox.checked;
                try {
                    const res = await fetch('/skills/toggle', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ skill_name: name, enabled: enabled })
                    });
                    const data = await res.json();
                    if (data.success) {
                        showToast(data.message || (enabled ? '已启用' : '已禁用'));
                        await updateSkillCount();
                        renderSkills();
                    } else {
                        checkbox.checked = !enabled;
                        showToast(data.error || '操作失败');
                    }
                } catch (err) {
                    checkbox.checked = !enabled;
                    showToast('网络错误');
                }
            });

            function openModal() {
                modal.classList.add('active');
                updateSkillCount();
                setTimeout(renderSkills, 200);
            }

            function closeModal() {
                modal.classList.remove('active');
            }

            manageBtn.addEventListener('click', openModal);
            closeModalBtn.addEventListener('click', closeModal);
            modal.addEventListener('click', (e) => {
                if (e.target === modal) closeModal();
            });

            // ===== 环境能力（动态渲染：只显示实际存在的能力） =====
            function renderEnv(caps) {
                const rows = [];
                rows.push(['平台', caps.platform || '未知']);
                if (caps.python) rows.push(['Python', caps.python]);
                rows.push(['联网', caps.network ? '✅ 可联网' : '❌ 离线']);
                if (Array.isArray(caps.actuators) && caps.actuators.length) {
                    rows.push(['舵机', `${caps.actuators.length} 个`]);
                }
                if (caps.display) rows.push(['屏幕', '有']);
                if (caps.audio_in) rows.push(['麦克风', '有']);
                if (caps.audio_out) rows.push(['喇叭', '有']);
                if (caps.camera) rows.push(['摄像头', '有']);
                if (Array.isArray(caps.libs) && caps.libs.length) {
                    rows.push(['可用库', caps.libs.join(', ')]);
                }
                rows.push(['来源', caps.source || 'probe']);
                if (caps.probed_at) rows.push(['探测时间', caps.probed_at]);

                const html = rows.map(([k, v]) =>
                    `<div class="env-row"><span class="k">${escapeHtml(k)}</span><span class="v">${escapeHtml(v)}</span></div>`
                ).join('');
                envBody.innerHTML = html + (
                    '<p style="color:#8a9aae;font-size:12px;padding:10px 2px 0;">' +
                    '能力随平台自动探测：Windows 不查 I2C/GPIO/OLED，Linux 才查硬件接口。<br>' +
                    '可用 POST /environment 手动补充（如声明舵机布局）。</p>'
                );
            }

            async function openEnvModal() {
                envModal.classList.add('active');
                envBody.innerHTML = '<p style="color:#8a9aae;text-align:center;padding:20px;">加载中…</p>';
                try {
                    const res = await fetch('/environment');
                    const data = await res.json();
                    renderEnv(data.capabilities || {});
                } catch {
                    envBody.innerHTML = '<p style="color:#ff7d7d;text-align:center;padding:20px;">无法获取环境信息</p>';
                }
            }

            envBtn.addEventListener('click', openEnvModal);
            closeEnvModalBtn.addEventListener('click', () => envModal.classList.remove('active'));
            envModal.addEventListener('click', (e) => {
                if (e.target === envModal) envModal.classList.remove('active');
            });

            // ===== 新增技能（模板 + 预览 + 确认） =====
            const addSkillModal = document.getElementById('addSkillModal');
            const addSkillBtn = document.getElementById('addSkillBtn');
            const closeAddSkillBtn = document.getElementById('closeAddSkillBtn');
            const addCancelBtn = document.getElementById('addCancelBtn');
            const addRegenBtn = document.getElementById('addRegenBtn');
            const addConfirmBtn = document.getElementById('addConfirmBtn');
            const templateGrid = document.getElementById('templateGrid');
            const addSkillInput = document.getElementById('addSkillInput');
            const previewBox = document.getElementById('previewBox');
            const previewName = document.getElementById('previewName');
            const previewDesc = document.getElementById('previewDesc');
            const previewCode = document.getElementById('previewCode');

            let pendingSkill = null;       // {name, desc, code}
            let selectedTemplate = null;   // 当前选中的模板名
            let previewTimer = null;
            let previewSeq = 0;
            const learnMaterial = document.getElementById('learnMaterial');
            const learnContent = document.getElementById('learnContent');
            const learnLevel = document.getElementById('learnLevel');

            async function openAddSkillModal() {
                addSkillModal.classList.add('active');
                resetAddView();
                try {
                    const res = await fetch('/skills/templates');
                    const data = await res.json();
                    const templates = data.templates || [];
                    templateGrid.innerHTML = templates.map(t => {
                        const cls = t.available ? '' : ' disabled';
                        const req = t.available ? '' : `（需：${(t.requires || []).join('、')}）`;
                        return `<button class="${cls}" data-name="${escapeHtml(t.name)}" ${t.available ? '' : 'disabled'}>${escapeHtml(t.description)}${req}</button>`;
                    }).join('');
                } catch {
                    templateGrid.innerHTML = '<p style="color:#8a9aae;font-size:12px;">模板加载失败</p>';
                }
                addSkillInput.focus();
            }

            function resetAddView() {
                selectedTemplate = null;
                pendingSkill = null;
                previewBox.style.display = 'none';
                addRegenBtn.style.display = 'none';
                addConfirmBtn.disabled = true;
                addSkillInput.value = '';
                learnMaterial.value = '';
                learnContent.value = '';
                learnLevel.value = '';
            }

            templateGrid.addEventListener('click', (e) => {
                const btn = e.target.closest('button[data-name]');
                if (!btn || btn.disabled) return;
                selectedTemplate = btn.dataset.name;
                addSkillInput.value = btn.textContent.replace(/（需：.*）$/, '').trim();
                preview();
            });

            addSkillInput.addEventListener('input', () => {
                clearTimeout(previewTimer);
                previewTimer = setTimeout(preview, 600);
            });
            addSkillInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    preview();
                }
            });
            // 学习模式：三要素任一填写 → 自动预览（组合成描述）
            [learnMaterial, learnContent, learnLevel].forEach(el => {
                el.addEventListener('input', () => {
                    clearTimeout(previewTimer);
                    previewTimer = setTimeout(preview, 600);
                });
            });

            async function preview() {
                const m = learnMaterial.value.trim();
                const c = learnContent.value.trim();
                const l = learnLevel.value.trim();
                const description = addSkillInput.value.trim();
                let body = null;
                if (selectedTemplate) {
                    body = { template: selectedTemplate };
                } else if (m || c || l) {
                    // 学习模式：把三要素组合成描述
                    body = { description: `目标材料：${m}。学习内容：${c}。学习程度：${l || '完全掌握'}` };
                } else if (description) {
                    body = { description };
                }
                if (!body) return;
                const seq = ++previewSeq;
                try {
                    const res = await fetch('/skills/preview', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(body)
                    });
                    const data = await res.json();
                    if (seq !== previewSeq) return;  // 过期响应丢弃
                    if (!res.ok || !data.success) {
                        previewBox.style.display = 'none';
                        addConfirmBtn.disabled = true;
                        showToast(data.error || '预览失败');
                        return;
                    }
                    pendingSkill = data.preview;
                    previewName.textContent = pendingSkill.name;
                    previewDesc.textContent = pendingSkill.desc;
                    previewCode.textContent = pendingSkill.code;
                    previewBox.style.display = 'block';
                    addRegenBtn.style.display = 'block';
                    addConfirmBtn.disabled = false;
                } catch (err) {
                    if (seq === previewSeq) {
                        previewBox.style.display = 'none';
                        addConfirmBtn.disabled = true;
                        showToast('预览请求失败');
                    }
                }
            }

            addRegenBtn.addEventListener('click', preview);

            addConfirmBtn.addEventListener('click', async () => {
                if (!pendingSkill) return;
                addConfirmBtn.disabled = true;
                try {
                    const res = await fetch('/skills/confirm', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            name: pendingSkill.name,
                            code: pendingSkill.code,
                            desc: pendingSkill.desc
                        })
                    });
                    const data = await res.json();
                    if (data.success) {
                        showToast(`✅ ${data.message}`);
                        addSkillModal.classList.remove('active');
                        resetAddView();
                        updateSkillCount();
                    } else {
                        addConfirmBtn.disabled = false;
                        showToast(data.error || '添加失败');
                    }
                } catch (err) {
                    addConfirmBtn.disabled = false;
                    showToast('添加请求失败');
                }
            });

            function closeAddSkillModal() {
                addSkillModal.classList.remove('active');
                resetAddView();
            }
            addSkillBtn.addEventListener('click', openAddSkillModal);
            closeAddSkillBtn.addEventListener('click', closeAddSkillModal);
            addCancelBtn.addEventListener('click', closeAddSkillModal);
            addSkillModal.addEventListener('click', (e) => {
                if (e.target === addSkillModal) closeAddSkillModal();
            });

            // ===== 事件绑定 =====
            clearBtn.addEventListener('click', () => {
                if (confirm('确定要清空所有对话吗？')) {
                    clearChat();
                }
            });

            sendBtn.addEventListener('click', sendMessage);

            // 键盘事件：Enter 发送 / Shift+Enter 换行 / ↑↓ 浏览历史
            input.addEventListener('keydown', (e) => {
                // 中文输入法组合期间不拦截
                if (e.isComposing || e.keyCode === 229) return;

                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                    return;
                }

                if (e.key === 'ArrowUp') {
                    const firstNl = input.value.indexOf('\n');
                    const atFirstLine = firstNl === -1 || input.selectionStart <= firstNl;
                    if (!atFirstLine || sentHistory.length === 0) return;
                    e.preventDefault();
                    if (historyIndex === -1) historyDraft = input.value;
                    if (historyIndex < sentHistory.length - 1) {
                        historyIndex++;
                        input.value = sentHistory[sentHistory.length - 1 - historyIndex];
                        input.setSelectionRange(input.value.length, input.value.length);
                        autoResize();
                    }
                    return;
                }

                if (e.key === 'ArrowDown') {
                    const lastNl = input.value.lastIndexOf('\n');
                    const atLastLine = lastNl === -1 || input.selectionStart > lastNl;
                    if (!atLastLine || sentHistory.length === 0) return;
                    e.preventDefault();
                    if (historyIndex > 0) {
                        historyIndex--;
                        input.value = sentHistory[sentHistory.length - 1 - historyIndex];
                    } else if (historyIndex === 0) {
                        historyIndex = -1;
                        input.value = historyDraft;
                    } else {
                        return;
                    }
                    input.setSelectionRange(input.value.length, input.value.length);
                    autoResize();
                }
            });

            document.querySelectorAll('.quick-actions button').forEach(btn => {
                btn.addEventListener('click', () => {
                    input.value = btn.getAttribute('data-msg');
                    autoResize();
                    sendMessage();
                });
            });

            // ===== 初始化 =====
            updateSkillCount();
            setTimeout(() => {
                addMessage(
                    '你好！我是小虾米 🦐\n\n目前是**最简状态**：\n' +
                    '• 聊天问答 · 记住你的事情（名字/偏好/事实）\n' +
                    '• 想让我学新技能，说「新增技能：XXX」\n' +
                    '• 技能出错我会自己修复\n\n' +
                    '💡 小技巧：\n' +
                    '• 把鼠标移到消息上可以**复制 / 引用**回答\n' +
                    '• 按 **↑ ↓ 键** 浏览你发送过的消息记录',
                    false
                );
            }, 300);

            input.focus();

            // 每30秒更新技能计数
            setInterval(updateSkillCount, 30000);
        })();
    </script>
</body>
</html>
